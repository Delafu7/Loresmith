name: CI

# Requires two repo secrets for the image-push job (Settings -> Secrets and
# variables -> Actions): DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token, not your account password: hub.docker.com -> Account
# Settings -> Security -> New Access Token).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Mirrors docker-compose.yml's postgres/redis services (same images,
    # same host ports) so DATABASE_URL/REDIS_URL below match .env.example
    # exactly — nothing DB-related needed a different config for CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dnd
          POSTGRES_PASSWORD: dnd
          POSTGRES_DB: dnd_campaign_manager
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dnd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dnd:dnd@localhost:5433/dnd_campaign_manager
      REDIS_URL: redis://localhost:6380
      SESSION_SECRET: ci-test-secret
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:5173
      MAX_UPLOAD_BYTES: 5242880
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run migrate --workspace=packages/server
      - run: npm run seed --workspace=packages/server

      # Run twice in a row — the integration tests are written to be
      # idempotent/order-independent (see README), and a repeat run is the
      # cheapest way to catch state leakage in CI before it ever reaches a
      # real deploy.
      - run: npm test
      - run: npm test

      - run: npm run build

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/loresmith-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/loresmith-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/loresmith-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/loresmith-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
